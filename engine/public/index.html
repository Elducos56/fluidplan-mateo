<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fluidplan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171717'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23fafafa' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Theme set before the first paint, to avoid a light flash in dark mode.
    (function () {
      var choice = "system";
      try { choice = localStorage.getItem("fluidplan:theme") || "system"; } catch (e) {}
      var forced = new URLSearchParams(location.search).get("theme");
      var value = forced || choice;
      var dark = value === "dark" || (value === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/visuals.css">
</head>
<body>
  <div id="app" class="app">
    <div class="boot-box"><span class="skeleton boot-skeleton"></span></div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
